# NOTE: Nginx OSS doesn't support dynamic upstream resolution with 'resolve' keyword.
# Instead, we use variables with proxy_pass for lazy DNS resolution.
# The prerender services must be healthy for the proxy to work.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker internal DNS resolver with short TTL for dynamic resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # GZIP compression - OPTIMIZED for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml
        font/woff
        font/woff2;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bulletproof SPA fallback - any 404 serves index.html with 200
    error_page 404 = /index.html;

    # Bot detection map
    set $is_bot 0;
    
    # Google bots
    if ($http_user_agent ~* "googlebot|google-inspectiontool|googleother|google-extended|storebot-google|google-safety") {
        set $is_bot 1;
    }
    
    # Bing & Microsoft bots
    if ($http_user_agent ~* "bingbot|msnbot|bingpreview") {
        set $is_bot 1;
    }
    
    # Social media crawlers
    if ($http_user_agent ~* "facebookexternalhit|facebot|twitterbot|linkedinbot|pinterest|slackbot|whatsapp|telegrambot|discordbot") {
        set $is_bot 1;
    }
    
    # SEO tools bots
    if ($http_user_agent ~* "semrushbot|ahrefsbot|mj12bot|dotbot|rogerbot|screaming frog|seokicks|sistrix|seobility|serpstatbot|dataforseo|megaindex") {
        set $is_bot 1;
    }
    
    # AI bots & crawlers
    if ($http_user_agent ~* "gptbot|chatgpt-user|oai-searchbot|claudebot|claude-user|anthropic-ai|claude-web|cohere-ai|perplexitybot|youbot|ccbot|omgilibot|ia_archiver|meta-externalagent|meta-externalfetcher|bytespider|amazonbot|applebot-extended|diffbot|google-extended|timpibot|webzio-extended") {
        set $is_bot 1;
    }
    
    # Other search engines
    if ($http_user_agent ~* "yandexbot|baiduspider|duckduckbot|applebot|yahoo|sogou|exabot|facebot") {
        set $is_bot 1;
    }
    
    # Escaped fragment (legacy SEO)
    if ($args ~* "_escaped_fragment_") {
        set $is_bot 1;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Robots.txt - dynamic based on domain with specific sitemap file
    location = /robots.txt {
        default_type text/plain;
        
        # Disable caching for robots.txt
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Set domain and sitemap file based on TLD
        set $sitemap_domain "advisable.com";
        set $sitemap_filename "sitemap-en.xml";
        if ($host ~* "\.gr$") {
            set $sitemap_domain "advisable.gr";
            set $sitemap_filename "sitemap-el.xml";
        }
        if ($host ~* "\.es$") {
            set $sitemap_domain "advisable.es";
            set $sitemap_filename "sitemap-es.xml";
        }
        if ($host ~* "\.fr$") {
            set $sitemap_domain "advisable.fr";
            set $sitemap_filename "sitemap-fr.xml";
        }
        if ($host ~* "\.it$") {
            set $sitemap_domain "advisable.it";
            set $sitemap_filename "sitemap-it.xml";
        }
        if ($host ~* "\.de$") {
            set $sitemap_domain "advisable.de";
            set $sitemap_filename "sitemap-de.xml";
        }
        
        return 200 "User-agent: *\nAllow: /\nSitemap: https://www.$sitemap_domain/$sitemap_filename\n\n# AI agents and assistants\n# LLM guide: https://www.$sitemap_domain/llms.txt\n# MCP discovery: https://www.$sitemap_domain/.well-known/mcp.json\n\nUser-agent: Googlebot\nAllow: /\n\nUser-agent: Google-Extended\nAllow: /\n\nUser-agent: Bingbot\nAllow: /\n\nUser-agent: GPTBot\nAllow: /\n\nUser-agent: OAI-SearchBot\nAllow: /\n\nUser-agent: ChatGPT-User\nAllow: /\n\nUser-agent: PerplexityBot\nAllow: /\n\nUser-agent: Perplexity-User\nAllow: /\n\nUser-agent: ClaudeBot\nAllow: /\n\nUser-agent: Claude-User\nAllow: /\n\nUser-agent: Applebot-Extended\nAllow: /\n\nUser-agent: Twitterbot\nAllow: /\n\nUser-agent: facebookexternalhit\nAllow: /\n";
    }

    # LLM discovery files - served statically, never prerendered
    location = /llms.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # MCP discovery document
    location = /.well-known/mcp.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }


    # Sitemap - redirect to language-specific sitemap
    location = /sitemap.xml {
        set $sitemap_file "sitemap-en.xml";
        
        if ($host ~* "\.gr$") {
            set $sitemap_file "sitemap-el.xml";
        }
        if ($host ~* "\.es$") {
            set $sitemap_file "sitemap-es.xml";
        }
        if ($host ~* "\.fr$") {
            set $sitemap_file "sitemap-fr.xml";
        }
        if ($host ~* "\.it$") {
            set $sitemap_file "sitemap-it.xml";
        }
        if ($host ~* "\.de$") {
            set $sitemap_file "sitemap-de.xml";
        }
        
        return 301 $scheme://$host/$sitemap_file;
    }
    
    # Static sitemap files
    location ~ ^/sitemap-(en|el|es|fr|it|de)\.xml$ {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }

    # Image proxy - optimized images (only if imgproxy is available)
    location /img/ {
        set $imgproxy_upstream "http://imgproxy:8080";
        
        rewrite ^/img/(.*)$ /$1 break;
        proxy_pass $imgproxy_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache optimized images
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800, immutable";
        
        # Fallback to direct file if imgproxy is not available
        proxy_intercept_errors on;
        error_page 502 503 504 = @static_image;
    }

    # Fallback for images when imgproxy is unavailable
    location @static_image {
        rewrite ^/img/(.*)$ /$1 break;
        try_files $uri =404;
    }

    # Fonts - long cache with immutable
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Hashed static assets (JS/CSS with hash in filename) - immutable cache
    location ~* \-[a-zA-Z0-9]+\.(js|css)$ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # Redirect legacy /services/* URLs to new clean routes
    location ~ ^/services/(.+)$ {
        return 301 /$1;
    }

    # Redirect old language-prefixed URLs to clean paths
    location ~ ^/(en|el|fr|it|es)/(.+)$ {
        return 301 /$2;
    }

    # Redirect language-only paths to root
    location ~ ^/(en|el|fr|it|es)$ {
        return 301 /;
    }

    # Prerender internal location - uses variable for dynamic resolution
    location @prerender {
        # Use variable to enable dynamic DNS resolution at runtime
        # Round-robin between prerender instances
        set $prerender_host "prerender1:3000";
        
        # Build the prerender URL with domain-specific cache key
        set $prerender_url "http://$prerender_host/https://$host$request_uri";
        
        proxy_pass $prerender_url;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Prerender specific headers
        proxy_set_header X-Prerender-Token "";
        proxy_set_header X-Prerender-Host $host;
        
        # Timeouts for prerender
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Cache prerendered content (only successful responses; 404s
        # are intercepted and routed to @spa_fallback above).
        proxy_cache_valid 200 24h;
        
        # Add headers for debugging
        add_header X-Prerender "true" always;
        add_header X-Prerender-Host $host always;
        
        # Fallback to SPA on prerender failure OR upstream 404
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @spa_fallback;
    }
    
    # SPA fallback when prerender is unavailable.
    # Serves index.html as 200 regardless of the original $uri (which may have
    # been mutated by an internal rewrite to /prerender_proxy).
    location @spa_fallback {
        root /usr/share/nginx/html;
        rewrite ^.*$ /index.html last;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Prerender-Fallback "true" always;
    }

    # Main location - SPA routing with prerender for bots
    location / {
        # For bots, try prerender first
        set $serve_prerender 0;
        if ($is_bot = 1) {
            set $serve_prerender 1;
        }
        
        # Skip prerender for static files
        if ($uri ~* \.(js|css|xml|less|png|jpg|jpeg|gif|pdf|doc|txt|ico|rss|zip|mp3|rar|exe|wmv|doc|avi|ppt|mpg|mpeg|tif|wav|mov|psd|ai|xls|mp4|m4a|swf|dat|dmg|iso|flv|m4v|torrent|ttf|woff|woff2|svg|eot)$) {
            set $serve_prerender 0;
        }
        
        # Route to prerender for bots using variable for dynamic resolution
        if ($serve_prerender = 1) {
            set $prerender_target "http://prerender1:3000/https://$host$request_uri";
            rewrite .* /prerender_proxy last;
        }
        
        # SPA fallback for regular users
        try_files $uri $uri/ /index.html;

        # Cache control for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # Domain-based content replacement for SEO
        sub_filter_once off;
        sub_filter_types text/html;
        
        # Determine target domain and language based on TLD
        set $target_domain "advisable.com";
        set $html_lang "en";
        
        if ($host ~* "\.gr$") {
            set $target_domain "advisable.gr";
            set $html_lang "el";
        }
        if ($host ~* "\.es$") {
            set $target_domain "advisable.es";
            set $html_lang "es";
        }
        if ($host ~* "\.fr$") {
            set $target_domain "advisable.fr";
            set $html_lang "fr";
        }
        if ($host ~* "\.it$") {
            set $target_domain "advisable.it";
            set $html_lang "it";
        }
        if ($host ~* "\.de$") {
            set $target_domain "advisable.de";
            set $html_lang "de";
        }
        
        # Replace lang="en" with correct language
        sub_filter 'lang="en"' 'lang="$html_lang"';
        
        # Replace all advisable.com occurrences with correct domain
        sub_filter 'advisable.com' '$target_domain';
    }

    # Internal location for prerender proxy with dynamic resolution
    location = /prerender_proxy {
        internal;
        
        # Dynamic resolution using variable
        proxy_pass $prerender_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Prerender-Host $host;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Add debug headers
        add_header X-Prerender "true" always;
        add_header X-Prerender-Host $host always;
        
        # Fallback to SPA on prerender failure OR upstream 404 (so bots
        # never get an empty/404 page when prerender misroutes — they get
        # the full SPA shell with meta tags instead).
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @spa_fallback;
    }

    # API proxy to backend (if needed)
    location /api/ {
        set $backend_upstream "http://localhost:3001";
        
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
